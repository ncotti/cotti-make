name: "BATS test"
description: <
  Execute all BATS tests in this repo
on: push

jobs:
  bats_test:
    runs-on: ubuntu-latest
    container:
      image: ncotti/cotti-make:latest
    env:
        # Modify to match your repo requirements
        REPO_PATH: cotti-make
        TEST_PATH: test
    steps:
      - name: "Checkout project repo"
        uses: actions/checkout@v5
        with:
          path: ${{ env.REPO_PATH }}
          submodules: "true"

      - name: Debug action paths
        shell: bash
        run: |
          echo "action_path=${{ github.action_path }}"
          pwd
          ls -la "${{ github.action_path }}"
          ls -la "${{ github.action_path }}/../../scripts"

      - name: "Call BATS tester"
        uses: ncotti/cotti-ci/actions/bats_tester@action-path
        with:
          target_dir: "${{ env.REPO_PATH }}/${{ env.TEST_PATH }}"